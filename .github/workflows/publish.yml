name: publish

# Builds the sdist and wheel and uploads them to PyPI when a GitHub release is
# published. Uses PyPI trusted publishing, so no API token is stored in GitHub.
# One-time setup on PyPI: add a trusted publisher for this repository with
# workflow "publish.yml" and environment "pypi"
# (https://docs.pypi.org/trusted-publishers/adding-a-publisher/).

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Upload to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/universal-stft
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
